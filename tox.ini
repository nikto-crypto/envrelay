[tox]
envlist = py310, py311, py312, py313, py314, py315
skip_missing_interpreters = true

[testenv]
description = Run the test suite
extras = cli
deps =
    pytest
    hypothesis
    ipython
passenv =
    ENVRELAY_ORACLE_DIR
    ENVRELAY_REQUIRE_ORACLE
    ENVRELAY_SCALE
    HOME
commands =
    pytest {posargs:-p no:warnings}

[testenv:docs]
description = Build the documentation site
deps = -r requirements-docs.txt
commands = mkdocs build --strict
