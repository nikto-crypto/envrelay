[tox]
envlist = py310, py311, py312, py313, py314, py315
skip_missing_interpreters = true

[testenv]
description = Run the standalone test suite (unit, conformance, lint)
extras = cli
deps =
    click==8.5.0
    pytest
    hypothesis
    ipython
passenv =
    ENVRELAY_ORACLE_DIR
    ENVRELAY_REQUIRE_ORACLE
    ENVRELAY_SCALE
    HOME
commands =
    pytest tests/unit tests/conformance tests/test_ast_lint.py {posargs:-p no:warnings}

[testenv:differential]
description = Run the full differential suite (needs the oracle, oracle Python only)
extras = cli
deps =
    click==8.5.0
    pytest
    hypothesis
    ipython
passenv =
    ENVRELAY_ORACLE_DIR
    ENVRELAY_REQUIRE_ORACLE
    ENVRELAY_SCALE
    HOME
commands =
    pytest {posargs:-p no:warnings -rs}

[testenv:docs]
description = Build the documentation site
deps = -r requirements-docs.txt
commands = mkdocs build --strict
