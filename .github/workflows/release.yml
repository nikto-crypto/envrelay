name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or commit) to build"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the version matches the package
        run: |
          python -c "import tomllib,sys; print('built', tomllib.load(open('pyproject.toml','rb'))['project']['name'])"
          ls -l dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      # Publishing to PyPI is intentionally manual: download the artifact and
      # upload with `twine`, or add a trusted-publishing step here when ready.
